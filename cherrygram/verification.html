<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verification Codes</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; background: #fafafa; }
h1 { font-size: 22px; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
th { background: #eee; }
pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; font-size: 13px; }
#info { margin-bottom: 10px; font-family: monospace; }
#status { color: #b00020; }
</style>
</head>
<body>
<h1>Verification Codes</h1>
<div id="info">
Refresh interval: 15 seconds<br>
Last refreshed: <span id="lastRef">—</span><br>
<span id="status"></span>
</div>

<table id="codes">
<thead>
<tr><th>Code</th><th>Time (UTC)</th><th>Service message</th></tr>
</thead>
<tbody></tbody>
</table>

<script>
// Deploy → Manage deployments → Web app URL: .../macros/s/<DEPLOY_ID>/exec
const DEPLOY_ID = "AKfycbxMcV_KFM9u2i6SaKYA3G-nVqiZlm2HEmb1GTYrtEfVQuqhVQ4sdKWQw0eUVX6ssRM6"; // update here: https://script.google.com
// Должен совпадать со значением SECRET_TOKEN в Script Properties
const TOKEN = "5NfkUTRAamkW0VI7zKE1S1giTnfU8u7n";

const API_URL = `https://script.google.com/macros/s/${DEPLOY_ID}/exec`;
const tbody = document.querySelector("#codes tbody");
const lastRef = document.getElementById("lastRef");
const statusEl = document.getElementById("status");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDateUTC(isoString) {
  const d = new Date(isoString);
  const pad = n => n.toString().padStart(2, '0');
  return `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.${d.getUTCFullYear()} ` +
         `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
}

function showData(data) {
  if (data.error) {
    statusEl.textContent = "Error: " + data.error;
    return;
  }
  statusEl.textContent = "";
  lastRef.textContent = formatDateUTC(new Date().toISOString());

  const sorted = (data.entries || []).sort((a, b) => new Date(b.timeUtc) - new Date(a.timeUtc));
  tbody.innerHTML = sorted.map(e => `
    <tr>
      <td>${escapeHtml(e.code || '')}</td>
      <td>${e.timeUtc ? formatDateUTC(e.timeUtc) : ''}</td>
      <td><pre>${escapeHtml((e.serviceMessage || '').replace(/\n\s*\n/g, '\n'))}</pre></td>
    </tr>
  `).join('');
}

// JSONP-запрос; если скрипт не загрузился или упал, покажем причину на странице
function refresh() {
  const script = document.createElement('script');
  script.src = `${API_URL}?token=${encodeURIComponent(TOKEN)}&callback=showData&_=${Date.now()}`;
  script.onload = () => script.remove();
  script.onerror = () => {
    statusEl.textContent = "Backend unreachable: check DEPLOY_ID, deployment access (Anyone) and script authorization";
    script.remove();
  };
  document.body.appendChild(script);
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
